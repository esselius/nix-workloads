version: "3"

vars:
  # Env used by the `dev-*` tasks below (key into inventory.nix).
  DEV_ENV: dev
  DEV_ZONE: dev.int.esselius.dev

tasks:
  up:
    desc: "Create/update a workload's instance. Usage: task up -- <name>"
    cmds:
      - tf {{index .CLI_ARGS_LIST 0}} apply

  down:
    desc: "Destroy a workload's instance. Usage: task down -- <name>"
    cmds:
      - tf {{index .CLI_ARGS_LIST 0}} destroy

  plan:
    desc: "Plan a workload's instance. Usage: task plan -- <name>"
    cmds:
      - tf {{index .CLI_ARGS_LIST 0}} plan

  bootstrap:
    desc: "Re-seed root SSH on an instance if the provisioner did not run. Usage: [ENV=dev] task bootstrap -- <name>"
    cmds:
      - |
        name="{{index .CLI_ARGS_LIST 0}}"
        env="${ENV:-homelab}"
        remote="$(scripts/remote-for.sh "$env" "$name")"
        INCUS_REMOTE="$remote" incus file push --uid 0 --gid 0 --mode 600 ~/.ssh/id_ed25519.pub "$name/root/.ssh/authorized_keys" --create-dirs

  onboard:
    desc: "Trust a guest's host key for sops and rekey its secret. Usage: task onboard -- <name>"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"
        env="${ENV:-homelab}"
        remote="$(scripts/remote-for.sh "$env" "$name")"
        export INCUS_REMOTE="$remote"

        # `dev` guests use the Mac's age key and are not re-keyed.
        # Guests without sops need nothing here.
        if [ "$env" != homelab ]; then
          echo "onboard: '$env' env - no per-guest key to trust; skipping"
          exit 0
        fi

        # Read the guest's SSH host key through the incus API (no network/SSH
        # needed) as an age recipient.
        recipient="$(incus exec "$name" -- cat /etc/ssh/ssh_host_ed25519_key.pub 2>/dev/null | ssh-to-age)"
        if [ -z "$recipient" ]; then
          echo "could not read the host key from '$name' - is it running?" >&2
          exit 1
        fi
        echo "$name -> $recipient"

        if grep -qF "$recipient" .sops.yaml; then
          echo "already trusted in .sops.yaml"
        else
          # With per-workload creation rules there is no single list to append
          # to; guessing would over-share a secret. Make the operator add the
          # key to exactly the rules this guest reads.
          {
            echo "error: $name's age recipient is not in .sops.yaml:"
            echo "  $recipient"
            echo
            echo "Add it to the creation rule(s) for:"
            echo "  secrets/$name.yaml (if it exists)"
            echo "  secrets/backup.yaml (if local.backup.paths is set)"
            echo "  any other sopsFile the guest reads (kanidm/monitoring/mosquitto)"
            echo
            echo "Then re-run: task onboard -- $name"
          } >&2
          exit 1
        fi

        if [ -f "secrets/$name.yaml" ]; then
          export SOPS_AGE_KEY_CMD="ssh-to-age -private-key -i $HOME/.ssh/id_ed25519"
          printf 'y\n' | sops updatekeys "secrets/$name.yaml"
        fi

        # The first deploy must copy the closure (COPY=1): the stock base image
        # trusts no internal CA and does not know the cache. After that switch,
        # modules/nix-cache.nix and modules/local.nix provide the CA and
        # substituters declaratively; no /etc/nix patch is needed.

  deploy:
    desc: "Deploy a guest's NixOS system. Usage: task deploy -- <name> (COPY=1 for a guest's first deploy)"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"
        env="${ENV:-homelab}"
        attr="$name"
        [ "$env" = homelab ] || attr="$name-$env"
        remote="$(scripts/remote-for.sh "$env" "$name")"
        export INCUS_REMOTE="$remote"

        ip="$(INCUS_REMOTE="$remote" incus config device get "$name" eth0 ipv4.address 2>/dev/null || true)"
        if [ -z "$ip" ]; then
          ip="$(INCUS_REMOTE="$remote" incus list "$name" -c 4 --format csv | head -1 | tr -d '\"')"
          ip="${ip%% *}"
        fi
        if [ -z "$ip" ]; then
          echo "no private IPv4 for instance '$name' - is it running?" >&2
          exit 1
        fi
        echo "deploying $attr to $name ($ip)"

        ca="${TMPDIR:-/tmp}/nix-workloads-ca-bundle.crt"
        base="$(nix config show ssl-cert-file 2>/dev/null || true)"
        if [ -z "$base" ] || [ ! -e "$base" ]; then base=/etc/ssl/certs/ca-certificates.crt; fi
        cat "$base" certs/root_ca.crt > "$ca"

        system="$(nix build ".#nixosConfigurations.$attr.config.system.build.toplevel" --no-link --print-out-paths --option ssl-cert-file "$ca" --option narinfo-cache-negative-ttl 0)"

        use_subs="--use-substitutes"
        ssh_opts="-o StrictHostKeyChecking=accept-new"
        if [ "$env" = homelab ]; then
          # attic/step-ca bootstrap the cache, so a miss there may still copy.
          case " attic step-ca " in
            *" $name "*)
              echo "bootstrap workload: a cache miss may copy"
              ;;
            *)
              if [ "${COPY:-0}" = 1 ]; then
                echo "COPY=1: first deploy - copying the closure from the builder"
              elif ! ssh -o StrictHostKeyChecking=accept-new "root@$ip" \
                nix-store --realise "$system" \
                --option download-attempts 1 --option connect-timeout 5 \
                --option narinfo-cache-negative-ttl 0; then
                echo "error: $name cannot substitute its closure from the cache." >&2
                echo "       run 'task cache-push -- $name' first, or COPY=1 for the first deploy" >&2
                exit 1
              fi
              ;;
          esac
        else
          # No Attic in `dev`; the closure is copied from the builder. There is
          # also no route to the guest subnet, so SSH jumps through the VM.
          use_subs=""
          profile="$(nix eval --raw --impure --expr "let i = import ./inventory.nix; e = i.envs.${env}; in (builtins.getAttr e.defaultHost e.hosts).colimaProfile")"
          sshcfg="${TMPDIR:-/tmp}/nix-workloads-colima-ssh.cfg"
          colima ssh-config --profile "$profile" > "$sshcfg"
          ssh_opts="-F $sshcfg -J colima-$profile -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # sops in `dev` decrypts with the Mac's age identity, not a per-guest
          # host key - push it before activation (harmless for guests without
          # sops).
          seedfile="${TMPDIR:-/tmp}/nix-workloads-dev-age.key"
          ssh-to-age -private-key -i "$HOME/.ssh/id_ed25519" > "$seedfile"
          INCUS_REMOTE="$remote" incus file push --uid 0 --gid 0 --mode 400 "$seedfile" \
            "$name/etc/nix-workloads/dev-age.key" --create-dirs
          rm -f "$seedfile"
          echo "$env env: no cache; copying the closure via the $profile VM"
        fi

        if ! NIX_CONFIG="ssl-cert-file = $ca" \
          NIX_SSHOPTS="$ssh_opts" \
          TMPDIR=/tmp \
            nixos-rebuild switch --flake ".#$attr" \
            --target-host "root@$ip" $use_subs; then
          # switch-to-configuration can exit non-zero for a transient unit
          # failure (e.g. journal-upload before the network is up). The
          # closure check below decides whether the deploy actually landed.
          echo "warning: nixos-rebuild reported a failure; verifying the active system" >&2
        fi

        if ! scripts/verify-guest.sh "$env" "$name" "$system"; then
          echo "deploy verification failed for $name" >&2
          if [ "${AUTO_ROLLBACK:-0}" = 1 ]; then
            echo "rolling $name back to the previous generation" >&2
            task rollback -- "$name"
          else
            echo "run 'task rollback -- $name' to revert" >&2
          fi
          exit 1
        fi

  verify:
    desc: "Smoke-test a guest's systemd state and main service. Usage: task verify -- <name>"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"
        env="${ENV:-homelab}"
        scripts/verify-guest.sh "$env" "$name"

  rollback:
    desc: "Roll a guest back to its previous generation and verify. Usage: task rollback -- <name>"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"
        env="${ENV:-homelab}"
        remote="$(scripts/remote-for.sh "$env" "$name")"
        export INCUS_REMOTE="$remote"
        incus exec "$name" -- nix-env --rollback -p /nix/var/nix/profiles/system
        # switch-to-configuration exits non-zero if any unit failed during the
        # switch (e.g. a transient network unit); the smoke test below is the
        # authority on whether the rollback actually converged.
        if ! incus exec "$name" -- /nix/var/nix/profiles/system/bin/switch-to-configuration switch; then
          echo "warning: activation reported failed units; checking actual state" >&2
        fi
        scripts/verify-guest.sh "$env" "$name"

  cache-push:
    desc: "Push a workload's system closure to Attic and Cachix. Usage: task cache-push -- <name>"
    cmds:
      - |
        name="{{index .CLI_ARGS_LIST 0}}"
        if [ "${ENV:-homelab}" != homelab ]; then
          echo "cache-push: '${ENV:-homelab}' env has no Attic cache; nothing to push"
          exit 0
        fi

        ca="${TMPDIR:-/tmp}/nix-workloads-ca-bundle.crt"
        base="$(nix config show ssl-cert-file 2>/dev/null || true)"
        if [ -z "$base" ] || [ ! -e "$base" ]; then base=/etc/ssl/certs/ca-certificates.crt; fi
        cat "$base" certs/root_ca.crt > "$ca"

        system="$(nix build ".#nixosConfigurations.$name.config.system.build.toplevel" --no-link --print-out-paths --option ssl-cert-file "$ca" --option narinfo-cache-negative-ttl 0)"
        echo "pushing $name ($system)"

        pushed=0
        if [ "${PUSH_ATTIC:-1}" = 1 ]; then
          if attic push "${CACHE:-homelab}" "$system"; then
            pushed=1
          else
            echo "warning: Attic push failed (is the attic workload reachable?)" >&2
          fi
        fi
        if [ "${PUSH_CACHIX:-1}" = 1 ]; then
          if ! command -v cachix >/dev/null 2>&1; then
            echo "warning: cachix not found (run inside the devshell)" >&2
          elif cachix push "${CACHIX_CACHE:-esselius}" "$system"; then
            pushed=1
          else
            echo "warning: Cachix push failed" >&2
          fi
        fi
        if [ "$pushed" = 0 ]; then
          echo "error: no cache accepted $name" >&2
          exit 1
        fi

  deploy-all:
    desc: "Apply DNS, then deploy every guest in dependency order. Usage: task deploy-all"
    cmds:
      - |
        set -e
        env="${ENV:-homelab}"
        export ENV="$env"
        # DNS is infrastructure (an Incus network zone), not a guest: apply it
        # before the workloads so their names resolve during deploy/verify.
        echo "==> apply dns ($env)"
        task up -- dns
        roots="step-ca"
        rest=$(for d in guests/*/; do
          n=${d#guests/}; n=${n%/}
          case " $roots example edge " in *" $n "*) ;; *) echo "$n";; esac
        done)
        for name in $roots $rest; do
          start=$(date +%s)
          echo "==> deploy $name"
          task deploy -- "$name"
          echo "    $name: $(( $(date +%s) - start ))s"
        done

  provision-all:
    desc: "Apply DNS, then up -> onboard -> cache-push -> first deploy (COPY=1) every guest except example/edge. Usage: task provision-all"
    cmds:
      - |
        set -e
        env="${ENV:-homelab}"
        export ENV="$env"
        # DNS is infrastructure (an Incus network zone), not a guest. Apply the
        # zone first; the guest loop below only handles guests/.
        echo "==> apply dns ($env)"
        task up -- dns
        roots="step-ca"
        rest=$(for d in guests/*/; do
          n=${d#guests/}; n=${n%/}
          case " $roots example edge " in *" $n "*) ;; *) echo "$n";; esac
        done)
        for name in $roots $rest; do
          start=$(date +%s)
          echo "==> $name: up"
          task up -- "$name"
          echo "==> $name: onboard"
          task onboard -- "$name"
          echo "==> $name: cache-push"
          case " $roots attic " in
            *" $name "*) echo "    bootstrap workload: skipping cache-push" ;;
            *) task cache-push -- "$name" ;;
          esac
          echo "==> $name: deploy (first boot; COPY=1)"
          COPY=1 task deploy -- "$name"
          echo "    $name: $(( $(date +%s) - start ))s"
        done

  fmt:
    desc: "Format all Nix files"
    cmds:
      - nix fmt

  check:
    desc: "Evaluate every guest + DNS/terranix config (or one: task check -- <name>)"
    cmds:
      - |
        name="{{.CLI_ARGS}}"
        if [ -z "$name" ]; then
          nix flake check
        else
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          nix build ".#checks.${system}.${name}"
        fi

  test-vm:
    desc: "Run the example NixOS VM test (needs a KVM-capable aarch64-linux builder)"
    cmds:
      - nix build .#packages.aarch64-linux.example-vm -L

  # --- Backup restore drill (DR) --------------------------------------------
  # Proves the restic backups are actually restorable: for each guest it runs
  # `restic check` and restores the latest snapshot of the env's backup repo to
  # a scratch dir, then asserts the expected state came back. Run against `dev`
  # as a rehearsal, or against `homelab` to validate the production backups.
  restore-test:
    desc: "Backup restore drill (check + restore latest + verify). Usage: [ENV=dev] task restore-test [-- <name>...]"
    cmds:
      - |
        set -e
        env="${ENV:-homelab}"
        names="{{.CLI_ARGS}}"
        [ -n "$names" ] || names="home-assistant zigbee2mqtt kanidm step-ca monitoring node-red"
        fail=0
        for name in $names; do
          echo "==> restore-test $name ($env)"
          remote="$(scripts/remote-for.sh "$env" "$name")"
          if INCUS_REMOTE="$remote" incus exec "$name" -- sh -s "$name" <<'DRILL'
        set -eu
        name="$1"
        scratch=/var/tmp/restore-drill
        rm -rf "$scratch"; mkdir -p "$scratch"
        echo "  restic check --read-data-subset=5%"
        if ! restic-system check --read-data-subset=5% >/dev/null 2>&1; then
          # A killed backup/restore can leave a stale lock; clear it and retry.
          restic-system unlock >/dev/null 2>&1 || true
          restic-system check --read-data-subset=5% >/dev/null
        fi
        echo "  restore latest -> $scratch"
        restic-system restore latest --target "$scratch" >/dev/null
        ok=1
        case "$name" in
          home-assistant)
            [ -d "$scratch/var/lib/hass/.storage" ] || { echo "  missing /var/lib/hass/.storage"; ok=0; }
            [ -f "$scratch/var/backup/hass.dump" ] || { echo "  missing hass.dump"; ok=0; }
            pg_restore --list "$scratch/var/backup/hass.dump" >/dev/null 2>&1 || { echo "  hass.dump is not a valid pg dump"; ok=0; }
            ;;
          kanidm)     [ -n "$(ls -A "$scratch/var/lib/kanidm" 2>/dev/null)" ] || { echo "  empty /var/lib/kanidm"; ok=0; } ;;
          step-ca)    [ -n "$(ls -A "$scratch/var/lib/step-ca" 2>/dev/null)" ] || { echo "  empty /var/lib/step-ca"; ok=0; } ;;
          monitoring) [ -f "$scratch/var/lib/monitoring/grafana/data/grafana.db" ] || { echo "  missing grafana.db"; ok=0; } ;;
          node-red)   [ -f "$scratch/var/lib/node-red/flows.json" ] || { echo "  missing flows.json"; ok=0; } ;;
          zigbee2mqtt)
            if [ -z "$(ls -A /var/lib/zigbee2mqtt 2>/dev/null)" ]; then
              echo "  no zigbee2mqtt state (unit gated off without the coordinator) - skipping"
            else
              [ -f "$scratch/var/lib/zigbee2mqtt/database.db" ] || { echo "  missing database.db"; ok=0; }
              [ -f "$scratch/var/lib/zigbee2mqtt/configuration.yaml" ] || { echo "  missing configuration.yaml"; ok=0; }
            fi
            ;;
          *) echo "  (no specific assertions)";;
        esac
        rm -rf "$scratch"
        [ "$ok" = 1 ]
        DRILL
          then echo "    PASS"; else echo "    FAIL"; fail=1; fi
        done
        if [ "$fail" = 0 ]; then
          echo "restore drill: OK"
        else
          echo "restore drill: FAILED"; exit 1
        fi

  # Restore a *homelab* backup into the *dev* env and prove the service loads.
  # Mirrors the guest's repo (restic copy) from the homelab backup server into
  # the dev one over the Mac, then restores it on top of the dev guest and
  # restarts the workload. This is the sandbox rehearsal of a real recovery.
  dr-restore:
    desc: "Restore a workload's homelab backup into the dev env and verify it loads. Usage: ENV=dev task dr-restore -- <name>"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"
        [ -n "$name" ] || { echo "Usage: ENV=dev task dr-restore -- <name>" >&2; exit 1; }
        [ "${ENV:-homelab}" = dev ] || { echo "dr-restore targets the dev env: ENV=dev task dr-restore -- <name>" >&2; exit 1; }
        for b in restic sops jq colima nix; do
          command -v "$b" >/dev/null || { echo "$b not found (run in the devshell)" >&2; exit 1; }
        done

        vmip="$(colima status --profile dev --json 2>/dev/null | jq -r '.ip_address // empty')"
        [ -n "$vmip" ] || { echo "colima profile 'dev' is not running" >&2; exit 1; }

        pwf="$(mktemp)"; trap 'rm -f "$pwf"' EXIT
        sops -d --extract '["restic_password"]' secrets/backup.yaml > "$pwf"
        export RESTIC_REST_USERNAME=restic
        export RESTIC_REST_PASSWORD="$(sops -d --extract '["restic_rest_password"]' secrets/backup.yaml)"

        prodip="$(nix eval --raw --impure --expr "let i = import ./inventory.nix; in i.ipFor \"homelab\" \"backup\"")"
        prod="rest:http://$prodip:8000/$name"
        dev="rest:http://$vmip:8000/$name"

        echo "==> mirror $name: homelab -> dev ($vmip:8000)"
        restic -r "$dev" --password-file "$pwf" init >/dev/null 2>&1 || true
        restic -r "$dev" --password-file "$pwf" copy \
          --from-repo "$prod" --from-password-file "$pwf" 2>&1 | tail -2

        echo "==> restore $name into the dev guest and load it"
        INCUS_REMOTE=colima-dev incus exec "$name" -- sh -s "$name" <<'RELOAD'
        set -eu
        name="$1"
        case "$name" in
          home-assistant) svc=home-assistant ;;
          kanidm)         svc=kanidm ;;
          step-ca)        svc=step-ca ;;
          monitoring)     svc=grafana ;;
          node-red)       svc=node-red ;;
          zigbee2mqtt)    svc=zigbee2mqtt ;;
          *) echo "no service mapping for $name"; exit 1 ;;
        esac
        echo "  stop $svc"
        systemctl stop "$svc" 2>/dev/null || true
        echo "  restore latest -> /"
        restic-system restore latest --target /
        if [ "$name" = zigbee2mqtt ]; then
          echo "  zigbee2mqtt restored (data-only; not loaded without the coordinator)"
          exit 0
        fi
        if [ "$name" = home-assistant ] && [ -f /var/backup/hass.dump ]; then
          echo "  pg_restore hass.dump into the recorder db"
          systemctl start postgresql
          for _ in $(seq 1 20); do runuser -u postgres -- pg_isready -q && break; sleep 1; done
          runuser -u postgres -- pg_restore -d hass --clean --if-exists /var/backup/hass.dump || true
        fi
        echo "  start $svc"
        systemctl start "$svc"
        ok=0
        for _ in $(seq 1 45); do
          systemctl is-active --quiet "$svc" && { ok=1; break; }
          sleep 2
        done
        if [ "$ok" = 0 ]; then echo "  $svc did not become active"; exit 1; fi
        if command -v curl >/dev/null 2>&1; then
          http=0
          for _ in $(seq 1 45); do
            case "$name" in
              home-assistant) curl -sf -o /dev/null http://127.0.0.1:8123/ && http=1 ;;
              kanidm)         curl -skf -o /dev/null https://127.0.0.1/status && http=1 ;;
              step-ca)        curl -skf -o /dev/null https://127.0.0.1:8443/health && http=1 ;;
              monitoring)     curl -sf -o /dev/null http://127.0.0.1:3000/api/health && http=1 ;;
              node-red)       curl -sf -o /dev/null http://127.0.0.1:1880/ && http=1 ;;
              *)              http=1 ;;
            esac
            [ "$http" = 1 ] && break
            sleep 2
          done
          if [ "$http" = 0 ]; then echo "  $name is active but its endpoint is not responding"; exit 1; fi
        fi
        echo "  OK: $name loaded in dev"
        RELOAD
        echo "==> $name: homelab backup restored into dev and loaded"

  dr-restore-all:
    desc: "Restore every supported workload's homelab backup into dev and verify it loads. Usage: ENV=dev task dr-restore-all"
    cmds:
      - |
        set -e
        [ "${ENV:-homelab}" = dev ] || { echo "dr-restore-all targets the dev env: ENV=dev task dr-restore-all" >&2; exit 1; }
        names="kanidm home-assistant step-ca monitoring zigbee2mqtt node-red"
        fail=0
        for n in $names; do
          echo "===== dr-restore $n ====="
          if ! task dr-restore -- "$n"; then echo "  $n: FAILED"; fail=1; fi
        done
        if [ "$fail" = 0 ]; then echo "dr-restore-all: OK"; else echo "dr-restore-all: FAILED"; exit 1; fi

  # --- Dev access (macOS) ---------------------------------------------------
  # The local `dev` env runs behind an incus bridge inside a Colima VM. Routing
  # the Mac into that subnet breaks its default route (macOS/vmnet), so nothing
  # touches the Mac's routing table: a `dev` `edge` workload does not terminate
  # TLS - it SNI-routes to the guests - and its `proxy` device publishes it on
  # the VM's own address (which the Mac already reaches). `dev-dns-up` maps
  # *.dev.int.esselius.dev to that VM address in /etc/hosts, and `ENV=dev`
  # deploys jump through the VM. These tasks are macOS-only for now.

  dev-bootstrap:
    desc: "Create the dev incus bridge(s) + container/vpn profiles on the dev VM(s)."
    cmds:
      - |
        set -e
        if [ "$(uname -s)" != "Darwin" ]; then
          echo "warning: dev-* targets are macOS-only; skipping" >&2
          exit 0
        fi
        command -v jq >/dev/null || { echo "jq not found" >&2; exit 1; }
        cfg="$(nix eval --impure --json --expr "let i = import ./inventory.nix; in { hosts = i.envs.{{.DEV_ENV}}.hosts; }")"
        dns="$(echo "$cfg" | jq -r '.hosts | to_entries[0].value.dnsAddress // empty')"
        echo "$cfg" | jq -r '.hosts | to_entries[] | "\(.value.remote)\t\(.value.subnet)\t\(.value.bridge)\t\(.value.colimaProfile // .key)"' \
          | while IFS=$'\t' read -r remote subnet bridge profile; do
              if ! INCUS_REMOTE="$remote" incus network show "$bridge" >/dev/null 2>&1; then
                INCUS_REMOTE="$remote" incus network create "$bridge" \
                  ipv4.address="${subnet}.1/24" ipv4.nat=false ipv6.address=none
              fi
              # Advertise a host resolver via DHCP when the env defines one.
              # `dev` has no Unbound instance; its guests keep the DHCP DNS.
              if [ -n "$dns" ]; then
                INCUS_REMOTE="$remote" incus network set "$bridge" dns.nameservers="$dns"
              fi
              INCUS_REMOTE="$remote" incus profile show container >/dev/null 2>&1 \
                || INCUS_REMOTE="$remote" incus profile create container
              if ! INCUS_REMOTE="$remote" incus profile show vpn >/dev/null 2>&1; then
                INCUS_REMOTE="$remote" incus profile create vpn
                INCUS_REMOTE="$remote" incus profile device add vpn eth0 nic network="$bridge"
              fi
              # The VM forwards the Mac's packets to the routed dev subnet; if it
              # also emits ICMP redirects, macOS installs them and clobbers its
              # default route (breaks web). Turn them off.
              colima ssh --profile "$profile" -- sudo -n sh -c '
                for i in all default col0 eth0 '"$bridge"'; do
                  sysctl -w net.ipv4.conf."$i".send_redirects=0 >/dev/null 2>&1 || true
                done' 2>/dev/null || true
              echo "bootstrapped $remote: $bridge ${subnet}.1/24 (dns $dns) + container/vpn (redirects off)"
            done

  dev-dns-up:
    desc: "Map *.dev.int.esselius.dev to the dev VM via a managed /etc/hosts block."
    cmds:
      - |
        set -e
        if [ "$(uname -s)" != "Darwin" ]; then
          echo "warning: dev-access targets are macOS-only; skipping" >&2
          exit 0
        fi
        for b in jq colima; do
          command -v "$b" >/dev/null || { echo "$b not found (run in the devshell)" >&2; exit 1; }
        done
        sudo -v
        profile="$(nix eval --impure --json --expr "let i = import ./inventory.nix; in i.envs.{{.DEV_ENV}}.hosts" \
          | jq -r 'to_entries[0] | (.value.colimaProfile // .key)')"
        vmip="$(colima status --profile "$profile" --json 2>/dev/null | jq -r '.ip_address // empty')"
        [ -n "$vmip" ] || { echo "colima profile '$profile' is not running" >&2; exit 1; }
        zone="$(nix eval --raw --impure --expr 'let i = import ./inventory.nix; in i.envs.{{.DEV_ENV}}.zone')"
        names="$(nix eval --impure --json --expr 'let i = import ./inventory.nix; in builtins.concatMap (s: s.dns or [ ]) (builtins.attrValues i.services)')"
        begin="# BEGIN nix-workloads dev (managed)"
        end="# END nix-workloads dev (managed)"
        tmp="$(mktemp)"
        sed "/$begin/,/$end/d" /etc/hosts > "$tmp"
        {
          cat "$tmp"
          echo "$begin"
          echo "$names" | jq -r --arg ip "$vmip" --arg z "$zone" '.[] | "\($ip) \(.).\($z)"'
          echo "$end"
        } | sudo tee /etc/hosts >/dev/null
        rm -f "$tmp"
        sudo dscacheutil -flushcache
        sudo killall -HUP mDNSResponder 2>/dev/null || true
        echo "mapped $(echo "$names" | jq 'length') dev names -> $vmip in /etc/hosts"

  dev-dns-down:
    desc: "Remove the managed dev /etc/hosts block."
    cmds:
      - |
        if [ "$(uname -s)" != "Darwin" ]; then
          echo "warning: dev-access targets are macOS-only; skipping" >&2
          exit 0
        fi
        sudo -v
        begin="# BEGIN nix-workloads dev (managed)"
        end="# END nix-workloads dev (managed)"
        tmp="$(mktemp)"
        sed "/$begin/,/$end/d" /etc/hosts > "$tmp"
        sudo tee /etc/hosts < "$tmp" >/dev/null
        rm -f "$tmp"
        sudo dscacheutil -flushcache
        sudo killall -HUP mDNSResponder 2>/dev/null || true
        echo "removed the dev /etc/hosts block"

  dev-access-up:
    desc: "DNS so the Mac can browse *.dev.int.esselius.dev like the homelab (no route)."
    deps: [dev-dns-up]

  dev-access-down:
    desc: "Tear down the dev DNS mapping."
    deps: [dev-dns-down]

  dev-access-status:
    desc: "Show the dev resolver entry and a sample lookup."
    cmds:
      - |
        if [ "$(uname -s)" != "Darwin" ]; then
          echo "warning: dev-access targets are macOS-only; skipping" >&2
          exit 0
        fi
        echo "--- /etc/hosts dev block"
        sed -n '/# BEGIN nix-workloads dev (managed)/,/# END nix-workloads dev (managed)/p' /etc/hosts 2>/dev/null || echo "(none)"
        echo "--- system lookup (uses /etc/hosts)"
        dscacheutil -q host -a name "home-assistant.{{.DEV_ZONE}}" 2>/dev/null || true
        echo "--- ingress on the VM"
        vmip="$(awk '/# BEGIN nix-workloads dev \(managed\)/{getline; print $1; exit}' /etc/hosts 2>/dev/null)"
        if [ -n "$vmip" ]; then
          nc -z -G 3 "$vmip" 443 && echo "$vmip:443 reachable" || echo "$vmip:443 not reachable"
        else
          echo "(no dev block - run task dev-access-up)"
        fi
