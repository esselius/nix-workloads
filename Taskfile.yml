version: "3"

tasks:
  up:
    desc: "Create/update a workload's instance. Usage: task up -- <name>"
    cmds:
      - tf {{index .CLI_ARGS_LIST 0}} apply

  down:
    desc: "Destroy a workload's instance. Usage: task down -- <name>"
    cmds:
      - tf {{index .CLI_ARGS_LIST 0}} destroy

  plan:
    desc: "Plan a workload's instance. Usage: task plan -- <name>"
    cmds:
      - tf {{index .CLI_ARGS_LIST 0}} plan

  bootstrap:
    desc: "Re-seed root SSH on an instance if the provisioner did not run. Usage: task bootstrap -- <name>"
    cmds:
      - incus file push --uid 0 --gid 0 --mode 600 ~/.ssh/id_ed25519.pub {{index .CLI_ARGS_LIST 0}}/root/.ssh/authorized_keys --create-dirs

  onboard:
    desc: "Trust a guest's host key for sops, rekey its secret, and seed Attic cache trust. Usage: task onboard -- <name>"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"

        ip="$(incus config device get "$name" eth0 ipv4.address 2>/dev/null || true)"
        if [ -z "$ip" ]; then
          ip="$(incus list "$name" -c 4 --format csv | head -1 | tr -d '\"')"
          ip="${ip%% *}"
        fi
        if [ -z "$ip" ]; then
          echo "no private IPv4 for instance '$name' - is it running?" >&2
          exit 1
        fi

        recipient="$(ssh-keyscan -t ed25519 "$ip" 2>/dev/null | ssh-to-age)"
        if [ -z "$recipient" ]; then
          echo "could not read the host key from $ip - is sshd up?" >&2
          exit 1
        fi
        echo "$name ($ip) -> $recipient"

        if grep -qF "$recipient" .sops.yaml; then
          echo "already trusted in .sops.yaml"
        else
          awk -v r="$recipient" -v n="$name" '
            { lines[NR]=$0
              if ($0 ~ /-[[:space:]]*age1[0-9a-z]+/) {
                last=NR
                indent=substr($0,1,match($0,/[^[:space:]]/)-1)
              }
            }
            END { for (i=1;i<=NR;i++) { print lines[i]; if (i==last) printf "%s- %s # %s\n", indent, r, n } }
          ' .sops.yaml > .sops.yaml.tmp
          mv .sops.yaml.tmp .sops.yaml
          echo "added $name to .sops.yaml"
        fi

        if [ -f "secrets/$name.yaml" ]; then
          export SOPS_AGE_KEY_CMD="ssh-to-age -private-key -i $HOME/.ssh/id_ed25519"
          printf 'y\n' | sops updatekeys "secrets/$name.yaml"
        fi

        substituter="$(nix eval --raw ".#nixosConfigurations.$name.config.nix.settings.extra-substituters" --apply 'builtins.concatStringsSep " "')"
        cachekey="$(nix eval --raw ".#nixosConfigurations.$name.config.nix.settings.extra-trusted-public-keys" --apply 'builtins.concatStringsSep " "')"
        incus file push --create-dirs --uid 0 --gid 0 --mode 644 certs/root_ca.crt "$name/etc/nix/internal-root-ca.crt"
        incus exec "$name" -- sh -ec '
          export PATH=/run/current-system/sw/bin:/run/wrappers/bin:$PATH
          f=/etc/nix/nix.conf
          if [ -L "$f" ]; then
            target="$(readlink -f "$f")"
            rm -f "$f"
            cp "$target" "$f"
          fi
          bundle=/etc/ssl/certs/ca-certificates.crt
          [ -e "$bundle" ] || bundle=/etc/ssl/certs/ca-bundle.crt
          cat "$bundle" /etc/nix/internal-root-ca.crt > /etc/nix/ssl-cert-file.pem
          if ! grep -q "nix-workloads cache seed" "$f"; then
            printf "\n# nix-workloads cache seed\nextra-substituters = %s\nextra-trusted-public-keys = %s\nssl-cert-file = /etc/nix/ssl-cert-file.pem\n" "$1" "$2" >> "$f"
          fi
          systemctl restart nix-daemon
        ' sh "$substituter" "$cachekey"

  deploy:
    desc: "Deploy a guest's NixOS system. Usage: task deploy -- <name>"
    cmds:
      - |
        set -e
        name="{{index .CLI_ARGS_LIST 0}}"

        ip="$(incus config device get "$name" eth0 ipv4.address 2>/dev/null || true)"
        if [ -z "$ip" ]; then
          ip="$(incus list "$name" -c 4 --format csv | head -1 | tr -d '\"')"
          ip="${ip%% *}"
        fi
        if [ -z "$ip" ]; then
          echo "no private IPv4 for instance '$name' - is it running?" >&2
          exit 1
        fi
        echo "deploying to $name ($ip)"

        ca="${TMPDIR:-/tmp}/nix-workloads-ca-bundle.crt"
        base="$(nix config show ssl-cert-file 2>/dev/null || true)"
        if [ -z "$base" ] || [ ! -e "$base" ]; then base=/etc/ssl/certs/ca-certificates.crt; fi
        cat "$base" certs/root_ca.crt > "$ca"

        system="$(nix build ".#nixosConfigurations.$name.config.system.build.toplevel" --no-link --print-out-paths --option ssl-cert-file "$ca" --option narinfo-cache-negative-ttl 0)"

        # attic/step-ca/coredns bootstrap the cache, so a miss there may still copy.
        case " attic step-ca coredns " in
          *" $name "*)
            echo "bootstrap workload: a cache miss may copy"
            ;;
          *)
            if ! ssh -o StrictHostKeyChecking=accept-new "root@$ip" \
              nix-store --realise "$system" \
              --option download-attempts 1 --option connect-timeout 5 \
              --option narinfo-cache-negative-ttl 0; then
              echo "error: $name cannot substitute its closure from the cache." >&2
              echo "       run 'task cache-push -- $name' first" >&2
              exit 1
            fi
            ;;
        esac

        NIX_CONFIG="ssl-cert-file = $ca" \
        NIX_SSHOPTS="-o StrictHostKeyChecking=accept-new" \
          nixos-rebuild switch --flake ".#$name" \
          --target-host "root@$ip" --use-substitutes

  cache-push:
    desc: "Push a workload's system closure to the Attic cache. Usage: task cache-push -- <name>"
    cmds:
      - |
        name="{{index .CLI_ARGS_LIST 0}}"

        ca="${TMPDIR:-/tmp}/nix-workloads-ca-bundle.crt"
        base="$(nix config show ssl-cert-file 2>/dev/null || true)"
        if [ -z "$base" ] || [ ! -e "$base" ]; then base=/etc/ssl/certs/ca-certificates.crt; fi
        cat "$base" certs/root_ca.crt > "$ca"

        system="$(nix build ".#nixosConfigurations.$name.config.system.build.toplevel" --no-link --print-out-paths --option ssl-cert-file "$ca" --option narinfo-cache-negative-ttl 0)"
        echo "pushing $name ($system) to the cache"
        attic push "${CACHE:-homelab}" "$system"

  deploy-all:
    desc: "Deploy every workload in dependency order. Usage: task deploy-all"
    cmds:
      - |
        set -e
        roots="coredns step-ca"
        rest=$(for d in terraform/*/; do
          n=${d#terraform/}; n=${n%/}
          case " $roots example " in *" $n "*) ;; *) echo "$n";; esac
        done)
        for name in $roots $rest; do
          start=$(date +%s)
          echo "==> deploy $name"
          task deploy -- "$name"
          echo "    $name: $(( $(date +%s) - start ))s"
        done

  provision-all:
    desc: "up -> onboard -> cache-push -> deploy for every workload except example. Usage: task provision-all"
    cmds:
      - |
        set -e
        roots="coredns step-ca"
        rest=$(for d in terraform/*/; do
          n=${d#terraform/}; n=${n%/}
          case " $roots example " in *" $n "*) ;; *) echo "$n";; esac
        done)
        for name in $roots $rest; do
          start=$(date +%s)
          echo "==> $name: up"
          task up -- "$name"
          echo "==> $name: onboard"
          task onboard -- "$name"
          echo "==> $name: cache-push"
          task cache-push -- "$name" || echo "    cache-push failed for $name"
          echo "==> $name: deploy"
          task deploy -- "$name"
          echo "    $name: $(( $(date +%s) - start ))s"
        done

  fmt:
    desc: "Format all Nix files"
    cmds:
      - nix fmt

  check:
    desc: "Evaluate every guest + terranix config (or one: task check -- <name>)"
    cmds:
      - |
        name="{{.CLI_ARGS}}"
        if [ -z "$name" ]; then
          nix flake check
        else
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          nix build ".#checks.${system}.${name}"
        fi
